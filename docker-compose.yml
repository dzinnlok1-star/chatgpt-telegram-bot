services:
  bot:
    build: .
    container_name: chatgpt-telegram-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "${WEBHOOK_PORT:-8080}:${WEBHOOK_PORT:-8080}"
    # Если используете Postgres, раскомментируйте:
    # depends_on:
    #   - postgres

  # Раскомментируйте, если хотите Postgres вместо SQLite.
  # Не забудьте поменять DATABASE_URL в .env
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: chatgpt-telegram-bot-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: bot
  #     POSTGRES_PASSWORD: botpass
  #     POSTGRES_DB: chatgpt_bot
  #   volumes:
  #     - ./data/pg:/var/lib/postgresql/data
