[project]
name = "chatgpt-telegram-bot"
version = "1.0.0"
description = "Production-ready ChatGPT Telegram bot with subscriptions, referrals, multi-language and admin panel."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "dzinnlok1-star" }]
license = { text = "MIT" }

dependencies = [
  "aiogram>=3.7,<4.0",
  "openai>=1.35.0,<2.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "SQLAlchemy[asyncio]>=2.0.29,<3.0",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.1",
  "yookassa>=3.3.0",
  "aiohttp>=3.9.5",
  "tenacity>=8.3.0",
  "tiktoken>=0.7.0",
  "structlog>=24.1.0",
  "python-dotenv>=1.0.1",
  "orjson>=3.10.3",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
]

[project.scripts]
chatgpt-bot = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S", "RUF"]
# RUF001-003 отключаем глобально: в проекте много русского/украинского текста,
# где ruff ошибочно ругается на кириллические символы.
ignore = [
  "S101", "S105", "S106", "S110", "S112", "S311",
  "S104",  # 0.0.0.0 bind is intentional (Docker)
  "B008", "N818",
  "ASYNC110",  # while-sleep loop for webhook server
  "ASYNC240",  # sync pathlib is fine for small temp-file cleanup
  "E501",  # длинные строки допустимы
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E", "F", "I", "N"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
